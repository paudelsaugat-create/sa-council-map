name: Daily Vacancy Sync

on:
  schedule:
    - cron: '0 21 * * *'   # Runs automatically every night
  workflow_dispatch:         # Allows you to press a "Run" button manually

jobs:
  run-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run script
        run: python scraper.py

      - name: Commit and push vacancies
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sa_vacancies.json
          git commit -m "Auto-update vacancies" || exit 0
          git push
